[workspace]
members = [
    "darkforest-core",
    "darkforest-cuda",
    "darkforest-py",
    "models",
]
default-members = [
    "darkforest-core",
    "darkforest-cuda",
    "models",
]
resolver = "2"

[workspace.dependencies]
thiserror   = "1"
anyhow      = "1"
half        = { version = "2", features = ["num-traits"] }
num-traits  = "0.2"
rand        = "0.8"
rand_distr  = "0.4"
rayon       = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
log         = "0.4"
env_logger  = "0.11"
