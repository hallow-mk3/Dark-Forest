[package]
name = "darkforest-core"
version = "1.0.0"
description = "Deterministic Rust and CUDA machine learning runtime featuring pre-allocated static execution graphs and custom fused attention kernels."
license = "MIT"
authors = ["Dark Forest contributors"]
repository = "https://github.com/your-org/darkforest"
keywords = ["machine-learning", "cuda", "rust", "deep-learning", "transformer"]
categories = ["science", "machine-learning"]
edition = "2021"

[[bin]]
name = "grad_check"
path = "src/bin/grad_check.rs"

[[bin]]
name = "train_gpt2_small"
path = "src/bin/train_gpt2_small.rs"

[[bin]]
name = "train_static"
path = "src/bin/train_static.rs"

[[bin]]
name = "bench_sgemm"
path = "src/bin/bench_sgemm.rs"

[[bin]]
name = "bench_isolate"
path = "src/bin/bench_isolate.rs"

[[bin]]
name = "granular_bench"
path = "src/bin/granular_bench.rs"

[[bin]]
name = "darkforest_cli"
path = "src/bin/darkforest_cli.rs"

[[bin]]
name = "bench_sequence_limit"
path = "src/bin/bench_sequence_limit.rs"
required-features = ["cuda"]

[dependencies]
thiserror  = { workspace = true }
anyhow     = { workspace = true }
half       = { workspace = true }
num-traits = { workspace = true }
rand       = { workspace = true }
rand_distr = { workspace = true }
rayon      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
log        = { workspace = true }
env_logger = { workspace = true }
darkforest-cuda = { path = "../darkforest-cuda", optional = true }

[features]
cuda = ["dep:darkforest-cuda", "darkforest-cuda/cuda_kernels"]
