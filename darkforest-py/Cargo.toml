[package]
name = "darkforest-py"
version = "0.1.0"
description = "Python bindings for the Dark Forest ML runtime"
license = "MIT"
authors = ["Dark Forest contributors"]
repository = "https://github.com/your-org/darkforest"
keywords = ["python", "ml", "autograd", "bindings"]
categories = ["api-bindings", "machine-learning"]
edition = "2021"

[lib]
name = "darkforest_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
darkforest-core = { path = "../darkforest-core" }
anyhow = { workspace = true }

[features]
default = []
python = ["pyo3"]
cuda = ["darkforest-core/cuda"]
